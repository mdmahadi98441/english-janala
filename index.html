     <link rel="stylesheet" href="style/style.css">

                        <li>
                            <a href="" class=""><i class="fa-solid fa-circle-question"></i> FAQ
                            </a>
                        </li>
                        <li>
                            <a href="" class=""><i class="fa-solid fa-book-open"></i> Learn
                            </a>
                        </li>
                        <li>
                            <a href="" class=""><i class="fa-solid fa-right-from-bracket"></i> LogOut
                            </a>
                        </li>

                    </ul>
                </div>
                <a class="flex items-center gap-1">

            <div class="navbar-end hidden lg:flex">

                    <li>
                        <a href="" class="btn btn-outline btn-primary font-bold"><i class="fa-solid fa-book-open"></i>
                            Learn
                        </a>
                    </li>
                    <li>
                        <a href="" class="btn btn-outline btn-primary font-bold"><i
                                class="fa-solid fa-right-from-bracket"></i> LogOut
                        </a>
                    </li>
                </ul>
            </div>

        </div>

    <section class="flex flex-col-reverse md:flex-row items-center w-11/12 mx-auto gap-27 my-10">

            <h2 class="text-4xl font-bold my-5"> <span class="text-sky-400">English</span> is Easy!!</h2>
            <p class="bangla font-semibold my-10">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের

            <div>
                <fieldset class="fieldset bg-base-100  rounded-box w-xs  p-4">



                    <input type="email" class="input" placeholder="Email" />


                    <input type="password" class="input mt-4" placeholder="Password" />

                    <button class="btn btn-primary mt-4 w-30">Login</button>
                </fieldset>
            </div>

        </div>
        <div class="img flex-1 ">
            <img src="english-janala-resources/assets/hero-student.png" alt="">
        </div>

    <section>
        <h2 class="text-4xl font-bold my-5 text-center"> <span class="text-sky-400">Let's</span> Learn Vocabularies</h2>
